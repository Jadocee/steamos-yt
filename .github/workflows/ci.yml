name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v

      - name: ShellCheck
        run: shellcheck -x -P SCRIPTDIR install.sh uninstall.sh src/bin/nonsteamapps tests/sandbox.sh tests/fakes/sudo

      - name: JavaScript syntax
        run: node --check tools/render-artwork.js

      - name: Install, launch and uninstall in a sandbox
        run: tests/sandbox.sh
