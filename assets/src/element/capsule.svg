      <rect x="62" y="40" width="116" height="74" rx="26" fill="#FFFFFF"/>
      <path d="M84 104 L74 134 L110 110 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="96" cy="77" r="9" fill="#0B9F72"/>
      <circle cx="120" cy="77" r="9" fill="#0B9F72"/>
      <circle cx="144" cy="77" r="9" fill="#0B9F72"/>
