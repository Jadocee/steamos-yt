<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171D"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <radialGradient id="glow" cx="230" cy="205" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12C48E" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#12C48E" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#12C48E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="760" cy="330" r="300" gradientUnits="userSpaceOnUse">
