    </filter>
    <symbol id="emblem" viewBox="0 0 240 204">
      <rect x="0" y="0" width="240" height="168" rx="46" fill="url(#screen)"/>
      <rect x="0" y="0" width="240" height="168" rx="46" fill="url(#gloss)"/>
      <rect x="72" y="52" width="48" height="70" rx="9" fill="#FFFFFF" fill-opacity="0.55" transform="rotate(-14 96 87)"/>
      <rect x="120" y="52" width="48" height="70" rx="9" fill="#FFFFFF" fill-opacity="0.55" transform="rotate(14 144 87)"/>
      <rect x="92" y="40" width="56" height="82" rx="10" fill="#FFFFFF"/>
      <path d="M113 70 L113 92 L132 81 Z" fill="#6F6CEB" stroke="#6F6CEB" stroke-width="7" stroke-linejoin="round"/>
      <rect x="76" y="182" width="88" height="16" rx="8" fill="#8E66EE"/>
