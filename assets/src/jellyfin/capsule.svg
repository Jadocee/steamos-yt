  <rect y="640" width="600" height="260" fill="url(#fade)"/>
  <use href="#emblem" x="170" y="190" width="260" height="221" filter="url(#shadow)"/>
  <text x="300" y="560" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="112" letter-spacing="-4" fill="#FFFFFF">Jellyfin</text>
  <text x="306" y="622" text-anchor="middle" font-family="Inter" font-weight="600" font-size="28" letter-spacing="12" fill="#B8B8C4">YOUR MEDIA</text>
