  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#glow)"/>
  <rect width="600" height="900" fill="url(#glow2)"/>
  <g>
    <rect x="-40" y="676" width="120" height="180" rx="14" fill="url(#p1)"/>
    <rect x="96" y="676" width="120" height="180" rx="14" fill="url(#p2)"/>
    <rect x="232" y="676" width="120" height="180" rx="14" fill="url(#p2)"/>
    <rect x="368" y="676" width="120" height="180" rx="14" fill="url(#p2)"/>
    <rect x="504" y="676" width="120" height="180" rx="14" fill="url(#p2)"/>
    <rect x="-100" y="872" width="120" height="180" rx="14" fill="url(#p4)"/>
