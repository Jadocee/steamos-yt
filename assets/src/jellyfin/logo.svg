    <text x="372" y="226" font-family="Inter Display" font-weight="900" font-size="196" letter-spacing="-7" fill="#FFFFFF">Jellyfin</text>
    <text x="382" y="316" font-family="Inter" font-weight="600" font-size="44" letter-spacing="19" fill="#FFFFFF" fill-opacity="0.78">YOUR MEDIA</text>
