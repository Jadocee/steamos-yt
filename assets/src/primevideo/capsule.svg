  <text x="300" y="560" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="79.5" letter-spacing="-2.8" fill="#FFFFFF">Prime Video</text>
  <text x="306" y="622" text-anchor="middle" font-family="Inter" font-weight="600" font-size="28" letter-spacing="12" fill="#B8B8C4">FILMS &amp; SERIES</text>
