<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171D"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <radialGradient id="glow" cx="230" cy="205" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E7BFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#2E7BFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2E7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="760" cy="330" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1EC8FF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#1EC8FF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#1EC8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AAEFF"/>
      <stop offset="1" stop-color="#1450D8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <symbol id="emblem" viewBox="0 0 240 204">
      <rect x="0" y="0" width="240" height="168" rx="46" fill="url(#screen)"/>
      <rect x="0" y="0" width="240" height="168" rx="46" fill="url(#gloss)"/>
      <rect x="72" y="70" width="96" height="58" rx="10" fill="#FFFFFF"/>
      <g transform="rotate(-12 72 64)">
        <rect x="72" y="45" width="96" height="19" rx="5" fill="#FFFFFF"/>
        <path d="M92 45 L104 45 L96 64 L84 64 Z M124 45 L136 45 L128 64 L116 64 Z M156 45 L166 45 L160 64 L148 64 Z" fill="#1E5FE0"/>
      </g>
      <path d="M112 86 L112 112 L134 99 Z" fill="#1E5FE0" stroke="#1E5FE0" stroke-width="6" stroke-linejoin="round"/>
      <rect x="76" y="182" width="88" height="16" rx="8" fill="#5AAEFF"/>
    </symbol>
  </defs>
  <rect width="920" height="430" fill="url(#bg)"/>
  <rect width="920" height="430" fill="url(#glow)"/>
  <rect width="920" height="430" fill="url(#glow2)"/>
  <use href="#emblem" x="112" y="112" width="236" height="200" filter="url(#shadow)"/>
  <text x="380" y="236" font-family="Inter Display" font-weight="900" font-size="82.4" letter-spacing="-2.8" fill="#FFFFFF">Prime Video</text>
  <text x="386" y="294" font-family="Inter" font-weight="600" font-size="26" letter-spacing="11" fill="#B8B8C4">FILMS &amp; SERIES</text>
