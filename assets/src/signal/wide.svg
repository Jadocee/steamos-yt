    <symbol id="emblem" viewBox="0 0 240 204">
      <rect x="0" y="0" width="240" height="168" rx="46" fill="url(#screen)"/>
      <rect x="0" y="0" width="240" height="168" rx="46" fill="url(#gloss)"/>
      <circle cx="120" cy="78" r="46" fill="#FFFFFF"/>
      <path d="M90 112 L74 138 L112 122 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
      <path d="M109 76 V67 A11 11 0 0 1 131 67 V76" fill="none" stroke="#34507F" stroke-width="7" stroke-linecap="round"/>
      <rect x="100" y="74" width="40" height="30" rx="7" fill="#34507F"/>
      <circle cx="120" cy="87" r="4.5" fill="#FFFFFF"/>
      <rect x="118" y="88" width="4" height="9" rx="2" fill="#FFFFFF"/>
