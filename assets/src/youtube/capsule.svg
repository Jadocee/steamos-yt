<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171D"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="330" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF0033" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FF0033" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FF0033" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF3D5E"/>
      <stop offset="1" stop-color="#E0001E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2A33"/>
      <stop offset="1" stop-color="#18181E"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08080A" stop-opacity="0"/>
      <stop offset="1" stop-color="#08080A" stop-opacity="1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <symbol id="emblem" viewBox="0 0 240 204">
      <rect x="0" y="0" width="240" height="168" rx="46" fill="url(#screen)"/>
      <rect x="0" y="0" width="240" height="168" rx="46" fill="url(#gloss)"/>
      <path d="M100 58 L100 110 L146 84 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
      <rect x="76" y="182" width="88" height="16" rx="8" fill="#FF3D5E"/>
    </symbol>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#glow)"/>
  <g>
    <rect x="-60" y="704" width="176" height="99" rx="14" fill="url(#tile)"/>
    <rect x="136" y="704" width="176" height="99" rx="14" fill="url(#tile)"/>
    <rect x="332" y="704" width="176" height="99" rx="14" fill="url(#tile)"/>
    <rect x="528" y="704" width="176" height="99" rx="14" fill="url(#tile)"/>
    <rect x="136" y="704" width="176" height="99" rx="14" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <rect x="150" y="787" width="96" height="5" rx="2.5" fill="#FF0033"/>
    <rect x="-158" y="824" width="176" height="99" rx="14" fill="url(#tile)"/>
    <rect x="38" y="824" width="176" height="99" rx="14" fill="url(#tile)"/>
    <rect x="234" y="824" width="176" height="99" rx="14" fill="url(#tile)"/>
    <rect x="430" y="824" width="176" height="99" rx="14" fill="url(#tile)"/>
  </g>
  <rect y="640" width="600" height="260" fill="url(#fade)"/>
  <use href="#emblem" x="170" y="190" width="260" height="221" filter="url(#shadow)"/>
  <text x="300" y="560" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="112" letter-spacing="-4" fill="#FFFFFF">YouTube</text>
  <text x="306" y="622" text-anchor="middle" font-family="Inter" font-weight="600" font-size="28" letter-spacing="12" fill="#B8B8C4">ON TV</text>
</svg>
