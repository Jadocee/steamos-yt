# Extra Helium (Chromium) command-line flags, one per line; lines starting with # are ignored.
# --enable-features and --disable-features entries are merged with the built-in ones.

# Hardware video decoding through VA-API (AMD and Intel graphics, including the Steam Deck).
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder

# TV-style input: no pinch zoom or swipe-to-go-back from the touch screen or trackpads.
--disable-pinch
--overscroll-history-navigation=0

# Keep crash and error dialogs out of the kiosk.
--noerrdialogs

# Scale the interface, for example on a large TV at a short distance.
#--force-device-scale-factor=1.25

# Force GPU acceleration on graphics drivers Chromium blocks by default.
#--ignore-gpu-blocklist
