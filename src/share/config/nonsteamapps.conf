# NonSteamApps settings. Changes apply the next time an app starts.

# Separate sign-ins and data in every app for each Steam account (1), or one
# set shared by all accounts and by the apps' own menu entries (0).
PROFILE_PER_STEAM_ACCOUNT=1

# Helium apps (Helium, Prime Video, HBO Max, Netflix, Disney+, ProtonDB).
# Helium's services download Widevine, which the streaming apps need to play
# anything, and keep its ad blocker's filter lists current (1), or stay off (0).
HELIUM_SERVICES=1

# Interface scale for the Helium apps, Element and Signal: auto sizes them for a
# TV in Game Mode (1.5 at 1080p, 3 at 4K), or set a number such as 1.5. This
# replaces HELIUM_SCALE, which is still read.
TV_SCALE=auto

# YouTube (VacuumTube) turns Chromium's sandbox off in Game Mode, because its
# developer found it would not start there otherwise. Set 1 to keep the sandbox
# on: safer, but not yet confirmed on a Steam Deck. If YouTube then does not
# start in Game Mode, set it back to 0.
GAME_MODE_SANDBOX=0
