# NonSteamApps settings. Changes apply the next time an app starts.

# Separate sign-ins and data in every app for each Steam account (1), or one
# set shared by all accounts and by the apps' own menu entries (0).
PROFILE_PER_STEAM_ACCOUNT=1

# Helium apps (Helium, Prime Video, HBO Max). Helium's services download
# Widevine, which Prime Video and HBO Max need to play anything, and keep its
# ad blocker's filter lists current (1), or stay off (0).
HELIUM_SERVICES=1

# Interface scale for the Helium apps: auto sizes pages for a TV in Game Mode,
# or set a number such as 1.5.
HELIUM_SCALE=auto
