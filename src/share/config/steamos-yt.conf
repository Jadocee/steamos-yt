# SteamOS YT settings: one KEY=value per line, quotes optional.
# Changes apply the next time YouTube starts.

# Page opened in the kiosk. YouTube's TV interface lives at /tv.
YT_URL=https://www.youtube.com/tv

# Identity presented to YouTube:
#   cobalt  - a Cobalt-based TV device (default; YouTube only serves the TV interface to TV devices)
#   browser - Helium's own identity (YouTube then redirects to the desktop site)
YT_IDENTITY=cobalt

# Custom user agent. Replaces YT_IDENTITY and turns off Client Hint rewriting.
YT_USER_AGENT=

# Translate controller input into YouTube's console controls (1 = on, 0 = off).
YT_CONTROLLER=1

# Hold View + Menu for 1.5 seconds to close YouTube (1 = on, 0 = off).
YT_EXIT_COMBO=1

# SponsorBlock: skip community-marked segments automatically (1 = on, 0 = off).
YT_SPONSORBLOCK=1

# SponsorBlock segment types to skip, comma-separated: sponsor, selfpromo, interaction,
# intro, outro, preview, hook, filler, music_offtopic.
YT_SPONSORBLOCK_CATEGORIES=sponsor,selfpromo,interaction

# DeArrow: replace clickbait titles and thumbnails with community ones (1 = on, 0 = off).
YT_DEARROW=1

# DeArrow thumbnails (1 = on, 0 = titles only). YouTube's TV page only allows images from
# Google, so showing them requires dropping that page's Content Security Policy.
YT_DEARROW_THUMBNAILS=1

# Return YouTube Dislike: show dislike counts on videos (1 = on, 0 = off).
YT_RETURN_DISLIKES=1

# Seconds without mouse movement before the cursor hides (0 = never hide).
YT_CURSOR_HIDE_SECONDS=3

# Highest video size offered to the player:
#   auto   - YouTube decides from the window size (default)
#   screen - the smallest standard size covering the display (1080p on a Steam Deck)
#   720p, 1080p, 1440p, 2160p, 4320p or WIDTHxHEIGHT
YT_MAX_RESOLUTION=auto

# Video codecs to hide from YouTube, comma-separated: av1, vp9, vp8, h264.
# Hiding a codec your GPU cannot decode in hardware can save battery.
YT_BLOCK_CODECS=

# Display protocol for Helium: auto, x11 or wayland. auto uses x11 in Game Mode.
YT_OZONE_PLATFORM=auto

# 1 = full-screen kiosk without browser UI, 0 = normal window (troubleshooting).
YT_KIOSK=1

# Interface language such as en-AU. Empty follows the system locale.
YT_LANG=

# 1 = keep Steam's LD_PRELOAD/LD_LIBRARY_PATH for Helium (normally stripped for stability).
YT_KEEP_STEAM_ENV=0
